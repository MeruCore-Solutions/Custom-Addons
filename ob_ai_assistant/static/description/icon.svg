<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title>Smart AI Tool icon</title>
  <desc>Rounded square app icon with a luminous AI chat bubble and connected intelligence nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="160" y1="96" x2="864" y2="928" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.52" stop-color="#18212f"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientTransform="translate(300 250) rotate(45) scale(340 280)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientTransform="translate(760 300) rotate(120) scale(280 240)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bubble" x1="220" y1="240" x2="742" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="0.45" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="bubbleShade" x1="300" y1="300" x2="700" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="40" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
    <filter id="sparkShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#67e8f9" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="228" fill="url(#bg)"/>
  <circle cx="300" cy="250" r="280" fill="url(#glowA)"/>
  <circle cx="760" cy="300" r="240" fill="url(#glowB)"/>

  <g opacity="0.18">
    <path d="M180 250h664" stroke="#94a3b8" stroke-width="10" stroke-linecap="round"/>
    <path d="M180 780h664" stroke="#94a3b8" stroke-width="10" stroke-linecap="round"/>
    <path d="M220 210v604" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
    <path d="M804 210v604" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g filter="url(#panelShadow)">
    <path d="M250 238c-49 0-88 39-88 88v252c0 49 39 88 88 88h235l146 117c20 16 49 2 49-23v-94h95c49 0 88-39 88-88V326c0-49-39-88-88-88H250Z" fill="url(#bubble)"/>
    <path d="M250 238c-49 0-88 39-88 88v252c0 49 39 88 88 88h235l146 117c20 16 49 2 49-23v-94h95c49 0 88-39 88-88V326c0-49-39-88-88-88H250Z" fill="url(#bubbleShade)"/>
  </g>

  <g opacity="0.16">
    <circle cx="608" cy="394" r="172" fill="#ffffff"/>
  </g>

  <g fill="none" stroke="#f8fafc" stroke-linecap="round" stroke-linejoin="round">
    <path d="M332 538h152" stroke-width="32"/>
    <path d="M500 538h156" stroke-width="32"/>
    <path d="M494 538V420" stroke-width="32"/>
    <path d="M494 420c38-52 93-77 164-74" stroke-width="28" opacity="0.95"/>
  </g>

  <g fill="#ffffff">
    <circle cx="300" cy="538" r="38"/>
    <circle cx="494" cy="538" r="38"/>
    <circle cx="694" cy="538" r="38"/>
    <circle cx="494" cy="388" r="32"/>
    <circle cx="692" cy="344" r="28"/>
  </g>

  <g filter="url(#sparkShadow)" transform="translate(755 202)">
    <path d="M88 0 109 57 166 78 109 99 88 156 67 99 10 78 67 57Z" fill="#e0f2fe"/>
    <circle cx="0" cy="148" r="16" fill="#a7f3d0"/>
    <circle cx="168" cy="160" r="12" fill="#67e8f9"/>
  </g>

  <circle cx="760" cy="704" r="56" fill="#0f172a" opacity="0.3"/>
  <path d="M728 704h64" stroke="#d1fae5" stroke-width="18" stroke-linecap="round"/>
  <path d="M760 672v64" stroke="#d1fae5" stroke-width="18" stroke-linecap="round"/>
</svg>
